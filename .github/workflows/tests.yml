name: Institutional Quant Research CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-showcases:
    name: Run 5 Quantitative Research Showcase Test Suites
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy polars reportlab

      - name: Run 7 Research Showcase Test Suites (29 Tests)
        run: |
          python -m unittest discover research_showcases
